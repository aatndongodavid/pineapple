<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 48" width="200" height="48" fill="none">
  <!-- Logomark (Left) -->
  <g transform="translate(4, 4)">
    <!-- Crown Leaves -->
    <path d="M 20 12 C 18 6 12 2 8 2 C 10 7 14 11 18 13 Z" fill="#15803D" />
    <path d="M 20 12 C 22 6 28 2 32 2 C 30 7 26 11 22 13 Z" fill="#16A34A" />
    <path d="M 20 12 C 16 7 11 4 5 5 C 9 9 14 11 19 13 Z" fill="#15803D" opacity="0.9" />
    <path d="M 20 12 C 24 7 29 4 35 5 C 31 9 26 11 21 13 Z" fill="#16A34A" />
    <path d="M 20 12 C 20 4 20 0 20 0 C 20 4 20 8 20 12 Z" stroke="#16A34A" stroke-width="2.5" stroke-linecap="round" />

    <!-- Pineapple Body -->
    <path d="M 20 12 L 32 24 L 20 36 L 8 24 Z" fill="#F97316" />
    <!-- Light Facet / Highlight -->
    <path d="M 20 12 L 32 24 L 20 24 Z" fill="#FDBA74" opacity="0.75" />

    <!-- Subtle Geometric Facet Grid -->
    <line x1="14" y1="18" x2="26" y2="30" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="1.2" />
    <line x1="26" y1="18" x2="14" y2="30" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="1.2" />
  </g>

  <!-- Wordmark "Pineapple" -->
  <text x="56" y="32" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="24" letter-spacing="-0.5" fill="#1C1410">Pineapple</text>
</svg>
