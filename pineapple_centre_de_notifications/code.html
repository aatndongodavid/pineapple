<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Pineapple - Notifications</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;600&amp;family=Hanken+Grotesk:wght@400;600;700;800&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "primary-fixed": "#cce5ff",
                        "on-primary-fixed": "#001d31",
                        "on-surface-variant": "#42474d",
                        "surface-variant": "#d3e4fe",
                        "on-secondary": "#ffffff",
                        "tertiary-container": "#1c2e00",
                        "on-background": "#0b1c30",
                        "on-primary-container": "#7293b2",
                        "on-secondary-container": "#00714d",
                        "error": "#ba1a1a",
                        "tertiary": "#0c1800",
                        "surface-container": "#e5eeff",
                        "background": "#f8f9ff",
                        "surface-bright": "#f8f9ff",
                        "inverse-surface": "#213145",
                        "inverse-primary": "#a8caeb",
                        "surface-container-highest": "#d3e4fe",
                        "on-secondary-fixed": "#002113",
                        "outline-variant": "#c2c7ce",
                        "primary-fixed-dim": "#a8caeb",
                        "error-container": "#ffdad6",
                        "surface-container-high": "#dce9ff",
                        "surface-container-lowest": "#ffffff",
                        "surface-container-low": "#eff4ff",
                        "on-surface": "#0b1c30",
                        "surface-tint": "#40627e",
                        "surface": "#f8f9ff",
                        "surface-dim": "#cbdbf5",
                        "on-tertiary-fixed": "#121f00",
                        "secondary": "#006c49",
                        "tertiary-fixed": "#b2f746",
                        "tertiary-fixed-dim": "#98da27",
                        "on-tertiary": "#ffffff",
                        "on-error-container": "#93000a",
                        "primary-container": "#002b45",
                        "secondary-fixed": "#6ffbbe",
                        "on-primary-fixed-variant": "#274a65",
                        "on-tertiary-fixed-variant": "#334f00",
                        "primary": "#001626",
                        "on-tertiary-container": "#6a9f00",
                        "secondary-fixed-dim": "#4edea3",
                        "on-secondary-fixed-variant": "#005236",
                        "inverse-on-surface": "#eaf1ff",
                        "on-primary": "#ffffff",
                        "secondary-container": "#6cf8bb",
                        "outline": "#73777e",
                        "on-error": "#ffffff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "container-padding-mobile": "20px",
                        "unit": "4px",
                        "stack-md": "16px",
                        "container-padding-desktop": "40px",
                        "gutter": "24px",
                        "stack-sm": "8px",
                        "stack-lg": "32px"
                    },
                    "fontFamily": {
                        "label-sm": ["Geist"],
                        "display-lg": ["Hanken Grotesk"],
                        "title-md": ["Hanken Grotesk"],
                        "headline-lg-mobile": ["Hanken Grotesk"],
                        "body-lg": ["Inter"],
                        "body-md": ["Inter"],
                        "headline-lg": ["Hanken Grotesk"]
                    },
                    "fontSize": {
                        "label-sm": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600" }],
                        "display-lg": ["48px", { "lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "800" }],
                        "title-md": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "headline-lg-mobile": ["28px", { "lineHeight": "36px", "fontWeight": "700" }],
                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "700" }]
                    }
                }
            }
        }
    </script>
<style>
        /* Custom scrollbar hiding for filter chips */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        /* Soft mesh gradient background for canvas */
        .bg-mesh {
            background-color: #f8f9ff;
            background-image: 
                radial-gradient(at 0% 0%, hsla(210,100%,96%,1) 0px, transparent 50%),
                radial-gradient(at 100% 0%, hsla(210,100%,94%,1) 0px, transparent 50%),
                radial-gradient(at 100% 100%, hsla(210,100%,96%,1) 0px, transparent 50%),
                radial-gradient(at 0% 100%, hsla(210,100%,94%,1) 0px, transparent 50%);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-mesh min-h-screen text-on-surface font-body-md antialiased md:max-w-md md:mx-auto md:border-x md:border-outline-variant/20 md:shadow-2xl relative overflow-x-hidden">
<!-- TopAppBar -->
<header class="sticky top-0 z-40 flex justify-between items-center w-full px-5 py-4 bg-surface/40 backdrop-blur-xl border-b border-white/50 shadow-sm">
<button class="flex items-center justify-center p-2 -ml-2 rounded-full hover:bg-surface-variant/50 transition-colors">
<span class="material-symbols-outlined text-primary text-[24px]" style="font-variation-settings: 'FILL' 0;">arrow_back</span>
</button>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile font-bold text-primary absolute left-1/2 -translate-x-1/2">
            Notifications
        </h1>
<button class="font-label-sm text-label-sm text-primary hover:opacity-80 transition-opacity uppercase tracking-wider">
            Mark all
        </button>
</header>
<!-- Filter Chips -->
<div class="w-full px-container-padding-mobile py-stack-md flex gap-stack-sm overflow-x-auto no-scrollbar z-30 relative">
<button class="shrink-0 px-4 py-2 rounded-full bg-primary-container text-on-primary-container font-label-sm text-label-sm shadow-sm transition-transform active:scale-95 border border-primary-container/20">
            All
        </button>
<button class="shrink-0 px-4 py-2 rounded-full bg-white/60 backdrop-blur-md text-on-surface-variant font-label-sm text-label-sm border border-white/50 hover:bg-white/80 transition-colors shadow-[0_2px_10px_rgba(0,43,69,0.02)]">
            Academic
        </button>
<button class="shrink-0 px-4 py-2 rounded-full bg-white/60 backdrop-blur-md text-on-surface-variant font-label-sm text-label-sm border border-white/50 hover:bg-white/80 transition-colors shadow-[0_2px_10px_rgba(0,43,69,0.02)]">
            Social
        </button>
<button class="shrink-0 px-4 py-2 rounded-full bg-white/60 backdrop-blur-md text-on-surface-variant font-label-sm text-label-sm border border-white/50 hover:bg-white/80 transition-colors shadow-[0_2px_10px_rgba(0,43,69,0.02)]">
            System
        </button>
</div>
<!-- Notification List Canvas -->
<main class="px-container-padding-mobile pb-[100px] flex flex-col gap-stack-md z-20 relative">
<!-- Notification Card: Institutional (Unread) -->
<article class="relative w-full p-6 rounded-[24px] bg-white/80 backdrop-blur-[40px] border border-white/50 shadow-[0_10px_30px_rgba(0,43,69,0.05)] flex items-start gap-4 transition-transform active:scale-[0.98]">
<div class="absolute top-6 right-6 w-2.5 h-2.5 rounded-full bg-primary shadow-[0_0_8px_rgba(0,22,38,0.4)]"></div>
<div class="shrink-0 w-12 h-12 rounded-full bg-surface-container-high flex items-center justify-center border border-white/60">
<span class="material-symbols-outlined text-primary text-[24px]" style="font-variation-settings: 'FILL' 1;">school</span>
</div>
<div class="flex-1 pt-1 pr-6">
<h3 class="font-title-md text-title-md text-on-surface mb-1">New Exam Schedule Released</h3>
<p class="font-body-md text-body-md text-on-surface-variant/80 text-sm">10m ago</p>
</div>
</article>
<!-- Notification Card: Research (Read) -->
<article class="relative w-full p-6 rounded-[24px] bg-white/60 backdrop-blur-[20px] border border-white/40 shadow-[0_4px_20px_rgba(0,43,69,0.03)] flex items-start gap-4 transition-transform active:scale-[0.98] opacity-80 hover:opacity-100">
<div class="shrink-0 w-12 h-12 rounded-full bg-surface-container-high flex items-center justify-center border border-white/60">
<span class="material-symbols-outlined text-on-surface-variant text-[24px]" style="font-variation-settings: 'FILL' 0;">science</span>
</div>
<div class="flex-1 pt-1">
<h3 class="font-title-md text-title-md text-on-surface-variant mb-1">Dr. Thorne posted a new research update</h3>
<p class="font-body-md text-body-md text-on-surface-variant/60 text-sm">2h ago</p>
</div>
</article>
<!-- Notification Card: Community (Unread) -->
<article class="relative w-full p-6 rounded-[24px] bg-white/80 backdrop-blur-[40px] border border-white/50 shadow-[0_10px_30px_rgba(0,43,69,0.05)] flex items-start gap-4 transition-transform active:scale-[0.98]">
<div class="absolute top-6 right-6 w-2.5 h-2.5 rounded-full bg-primary shadow-[0_0_8px_rgba(0,22,38,0.4)]"></div>
<div class="shrink-0 w-12 h-12 rounded-full bg-secondary-container/30 flex items-center justify-center border border-white/60">
<span class="material-symbols-outlined text-on-secondary-container text-[24px]" style="font-variation-settings: 'FILL' 1;">groups</span>
</div>
<div class="flex-1 pt-1 pr-6">
<h3 class="font-title-md text-title-md text-on-surface mb-1">Club IA: New meeting scheduled</h3>
<p class="font-body-md text-body-md text-on-surface-variant/80 text-sm">5h ago</p>
</div>
</article>
<!-- Notification Card: System (Read) -->
<article class="relative w-full p-6 rounded-[24px] bg-white/60 backdrop-blur-[20px] border border-white/40 shadow-[0_4px_20px_rgba(0,43,69,0.03)] flex items-start gap-4 transition-transform active:scale-[0.98] opacity-80 hover:opacity-100">
<div class="shrink-0 w-12 h-12 rounded-full bg-surface-container-high flex items-center justify-center border border-white/60">
<span class="material-symbols-outlined text-on-surface-variant text-[24px]" style="font-variation-settings: 'FILL' 0;">verified_user</span>
</div>
<div class="flex-1 pt-1">
<h3 class="font-title-md text-title-md text-on-surface-variant mb-1">Your student certification is active</h3>
<p class="font-body-md text-body-md text-on-surface-variant/60 text-sm">Yesterday</p>
</div>
</article>
<!-- Notification Card: Social (Read) -->
<article class="relative w-full p-6 rounded-[24px] bg-white/60 backdrop-blur-[20px] border border-white/40 shadow-[0_4px_20px_rgba(0,43,69,0.03)] flex items-start gap-4 transition-transform active:scale-[0.98] opacity-80 hover:opacity-100">
<div class="shrink-0 w-12 h-12 rounded-full bg-surface-container-high flex items-center justify-center border border-white/60">
<span class="material-symbols-outlined text-on-surface-variant text-[24px]" style="font-variation-settings: 'FILL' 0;">chat</span>
</div>
<div class="flex-1 pt-1">
<h3 class="font-title-md text-title-md text-on-surface-variant mb-1">New message from David M.</h3>
<p class="font-body-md text-body-md text-on-surface-variant/60 text-sm">2 days ago</p>
</div>
</article>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 right-0 flex justify-around items-center px-4 py-3 bg-white/80 backdrop-blur-3xl border-t border-white/50 shadow-[0_-10px_30px_rgba(0,43,69,0.05)] rounded-t-xl z-50 md:max-w-md md:mx-auto">
<!-- Home (Inactive) -->
<button class="flex flex-col items-center justify-center text-on-surface-variant hover:text-primary transition-colors w-16 h-14 group">
<span class="material-symbols-outlined mb-1 group-hover:scale-110 transition-transform" style="font-variation-settings: 'FILL' 0;">home</span>
<span class="font-label-sm text-label-sm text-[10px]">Home</span>
</button>
<!-- Events (Inactive) -->
<button class="flex flex-col items-center justify-center text-on-surface-variant hover:text-primary transition-colors w-16 h-14 group">
<span class="material-symbols-outlined mb-1 group-hover:scale-110 transition-transform" style="font-variation-settings: 'FILL' 0;">calendar_month</span>
<span class="font-label-sm text-label-sm text-[10px]">Events</span>
</button>
<!-- Alerts (Active) -->
<button class="flex flex-col items-center justify-center bg-primary-container text-on-primary-container rounded-full px-5 py-2 w-auto h-14 shadow-sm scale-95 transition-all duration-300">
<span class="material-symbols-outlined mb-0.5" style="font-variation-settings: 'FILL' 1;">notifications</span>
<span class="font-label-sm text-label-sm text-[10px]">Alerts</span>
</button>
<!-- Profile (Inactive) -->
<button class="flex flex-col items-center justify-center text-on-surface-variant hover:text-primary transition-colors w-16 h-14 group">
<span class="material-symbols-outlined mb-1 group-hover:scale-110 transition-transform" style="font-variation-settings: 'FILL' 0;">person</span>
<span class="font-label-sm text-label-sm text-[10px]">Profile</span>
</button>
</nav>
</body></html>
