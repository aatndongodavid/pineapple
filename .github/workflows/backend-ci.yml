name: Backend CI

on:
  pull_request:
    branches: [main, deploy, refactor/*, feature-*]
  push:
    branches: [main, deploy, refactor/*, feature-*]

jobs:
  test-backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pineapple
          POSTGRES_PASSWORD: pineapple_test_password
          POSTGRES_DB: pineapple_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pineapple -d pineapple_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-asyncio pytest-cov httpx ruff alembic

      - name: Lint with Ruff
        run: |
          ruff check backend/src

      - name: Test Alembic Migrations
        env:
          DATABASE_URL: postgresql+asyncpg://pineapple:pineapple_test_password@localhost:5432/pineapple_test
        run: |
          alembic upgrade head
          alembic check

      - name: Run tests with pytest
        env:
          DATABASE_URL: postgresql+asyncpg://pineapple:pineapple_test_password@localhost:5432/pineapple_test
          PYTHONPATH: backend/src
          JWT_SECRET_KEY: dev_secret_key_change_me
          ELECTION_PEPPER_SECRET: dev_pepper_secret_change_me
          ENVIRONMENT: test
        run: |
          pytest tests