# nginx/nginx.conf

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format json_analytics escape=json '{'
        '"time_local":"$time_local",'
        '"remote_addr":"$remote_addr",'
        '"request_method":"$request_method",'
        '"request_uri":"$request_uri",'
        '"status":$status,'
        '"body_bytes_sent":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"upstream_response_time":"$upstream_response_time",'
        '"http_referrer":"$http_referer",'
        '"http_user_agent":"$http_user_agent",'
        '"http_x_forwarded_for":"$http_x_forwarded_for"'
    '}';

    access_log  /var/log/nginx/access.log  json_analytics;

    # Optimisation des E/S pour réseaux mobiles et gros volumes
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;

    # Timeouts adaptés aux réseaux mobiles lents (2G/3G/4G Cameroun)
    client_body_timeout 20s;
    client_header_timeout 20s;
    keepalive_timeout 65s;
    send_timeout 20s;
    client_max_body_size 25M;

    # Zones de Rate Limiting de premier niveau (Anti-DDoS / Anti-Bruteforce)
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;

    # Compression Gzip avancée
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        application/rss+xml
        font/woff2
        image/svg+xml;

    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # En-têtes de sécurité stricts (OWASP / HSTS / CSP)
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' ws: wss:;" always;

        # Intercepter les erreurs 502/503/504 pour servir la page de maintenance
        proxy_intercept_errors on;
        error_page 502 503 504 /maintenance.html;

        location = /maintenance.html {
            root /usr/share/nginx/html;
            internal;
        }

        # Page de santé externe NGINX
        location = /health {
            proxy_pass http://backend:8000/health;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Route rate-limitée pour l'authentification
        location /api/v1/identity/login {
            limit_req zone=auth_limit burst=10 nodelay;
            proxy_pass http://backend:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Tenant-ID $http_x_tenant_id;
        }

        # Proxy des appels API généraux vers le backend FastAPI
        location /api/ {
            limit_req zone=api_limit burst=50 nodelay;
            proxy_pass http://backend:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Tenant-ID $http_x_tenant_id;

            # Relayage correct des WebSockets
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $http_connection;

            proxy_connect_timeout 75s;
            proxy_send_timeout 75s;
            proxy_read_timeout 75s;
        }

        # Cache long et immuable pour les assets statiques frontend (PWA)
        location /assets/ {
            expires 365d;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # Service Worker & Manifeste PWA : Toujours revalider
        location = /sw.js {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            expires off;
        }

        location = /manifest.webmanifest {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            expires off;
        }

        # Fallback SPA React Router
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}