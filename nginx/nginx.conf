# nginx.conf
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compression gzip pour améliorer les performances
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript application/xml+rss application/rss+xml font/woff2 image/svg+xml;

    # Proxy des appels API vers le backend FastAPI
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Tenant-ID $http_x_tenant_id;  # Transmet le header tenant

        # Timeouts pour les requêtes longues (ex: upload de fichiers)
        proxy_connect_timeout 75s;
        proxy_send_timeout 75s;
        proxy_read_timeout 75s;
    }

    # Route de santé du backend (accessible sans /api)
    location = /health {
        proxy_pass http://backend:8000/health;
        proxy_set_header Host $host;
    }

    # Gestion du cache pour les assets statiques (PWA)
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Service Worker : pas de cache, toujours revalider
    location = /sw.js {
        add_header Cache-Control "no-cache";
        expires off;
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        expires off;
    }

    # Fallback SPA pour React Router : toutes les autres routes renvoient index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}